    <text x="24" y="212">  • Memory Limits    : MemoryMax=infinity, MemoryHigh=not_set (OOM hazard)</text>
    <text x="24" y="234">  • CPU Quota        : CPUQuota=infinity (Single thread can lock CPU core)</text>
    <text x="24" y="256">  • Task Threads     : TasksMax=infinity (Fork bomb vulnerability)</text>
