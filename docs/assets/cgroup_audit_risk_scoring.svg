    <text x="24" y="80">$ cgroupsentinel audit --unit heavy-worker.service</text>
    <text x="24" y="102">🔍 Systemd Unit Cgroup v2 Resource Audit: heavy-worker.service</text>
    <text x="24" y="124">======================================================================</text>
